name: Contract tests

on:
  push:
    paths:
      - "contract/**"
      - "fixtures/**"
      - "voice/mock_core/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contract/**"
      - "fixtures/**"
      - "voice/mock_core/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r contract/tests/requirements.txt
      - name: Feed is up to date with listings.json
        run: |
          python3 fixtures/build_feed.py
          git diff --exit-code fixtures/agencies/costa-test-homes/feed.xml
      - name: Contract bundle is up to date
        run: |
          python3 contract/bundle.py
          git diff --exit-code contract/CONTRACT_BUNDLE.md
      - name: Static contract tests
        run: python3 contract/tests/validate.py
      - name: Call scripts match the contract and the test agency
        run: python3 fixtures/calls/check_calls.py

  mock-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r contract/tests/requirements.txt
      - name: Call scripts replay cleanly against the mock
        run: python3 voice/mock_core/test_scripts_against_mock.py
      - name: Mock passes every contract example live
        run: |
          python3 voice/mock_core/server.py &
          for i in $(seq 1 50); do curl -sf http://localhost:8787/v2/health && break; sleep 0.2; done
          python3 contract/tests/validate.py --base-url http://localhost:8787/v2 --include-stateful
